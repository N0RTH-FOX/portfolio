<svg viewBox="0 0 200 200" xmlns='http://www.w3.org/2000/svg'>
    <filter id='noiseFilter'>
        <feTurbulence 
            type='fractalNoise' 
            baseFrequency='5' 
            numOctaves='1' 
            stitchTiles='stitch' />
    </filter>
    <feColorMatrix type='saturate' values='0' />
<rect
    width='100%' 
    height='100%' 
    filter='url(#noiseFilter)' />
</svg>